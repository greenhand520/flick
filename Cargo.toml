[workspace]
resolver = "3"
members = [
    "crates/flick-domain",
    "crates/flick-application",
    "crates/flick-runtime",
    "crates/flick-builtins",
    "crates/flick-ipc",
    "crates/flick-adapters-linux",
    "crates/flick-daemon",
    "crates/flick-cli",
    "crates/flick-testkit",
    "crates/flick-shell-gpui",
    "crates/flick-ui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Search
# 注意：crates.io 包名为 `ib-pinyin`，此处用 package 重命名以便代码内 `use ib_pinyin`。
ib_pinyin = { package = "ib-pinyin", version = "0.3" }

# Storage
rusqlite = {version = "0.40"}

# Linux / Portal
ashpd = { version = "0.13", default-features = false, features = ["async-io"] }
zbus = "5.18"

# Testing
tempfile = "3.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
