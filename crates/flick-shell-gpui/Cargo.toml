[package]
name = "flick-shell-gpui"
version.workspace = true
edition.workspace = true

[lib]
name = "flick_shell_gpui"
path = "src/lib.rs"

[[bin]]
name = "flick-gpui-demo"
path = "src/main.rs"

[dependencies]
flick-domain = { path = "../flick-domain" }
flick-application = { path = "../flick-application" }
flick-runtime = { path = "../flick-runtime" }
flick-builtins = { path = "../flick-builtins" }
flick-adapters-linux = { path = "../flick-adapters-linux" }
flick-ui = { path = "../flick-ui", features = ["gpui"] }
gpui-kit = "0.11"
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
